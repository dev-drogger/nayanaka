name: CI - Test and Build

# When to run this workflow
on:
  push:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linting (checks code style)
      - name: Run linting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Step 5: Run tests (skip for now since you don't have any)
      - name: Run test
        run: npm run test

      # Step 6: Try to build the project
      - name: Build project
        run: npm run build || echo "Build skipped - requires database connection"

      # Step 7: Save build results for next job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/ # Change to 'dist/' if you're not using Next.js
