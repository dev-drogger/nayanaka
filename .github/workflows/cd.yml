name: CD - Deploy to Vercel

# Run this after CI passes
on:
  workflow_run:
    workflows: ["CI - Test and Build"]
    types: [completed]
    branches: [development, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Step 0: Double-check that CI actually passed
      - name: Check CI status
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI workflow failed or was cancelled. Stopping deployment."
            exit 1
          else
            echo "✅ CI workflow passed. Proceeding with deployment."
          fi

      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment environment
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "VERCEL_ENV=production" >> $GITHUB_ENV
            echo "DEPLOY_MESSAGE=🚀 Production deployment" >> $GITHUB_ENV
          else
            echo "VERCEL_ENV=preview" >> $GITHUB_ENV
            echo "DEPLOY_MESSAGE=👨‍💻 Development deployment" >> $GITHUB_ENV
          fi

      # Step 3: Deploy to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ env.VERCEL_ENV == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

      # Step 4: Comment on PR with deployment URL (optional)
      - name: Comment PR
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
             github.rest.issues.createComment({
               issue_number: pr_number,
               owner: context.repo.owner,
               repo: context.repo.repo,
               body: '${{ env.DEPLOY_MESSAGE }} completed! 🎉'
             })
